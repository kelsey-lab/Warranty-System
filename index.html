<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>French Roofing Warranty Portal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;600&display=swap');
        body {
            font-family: 'Work Sans', sans-serif;
            background: linear-gradient(135deg, #1a1f2e 0%, #2d3748 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .container {
            text-align: center;
            max-width: 600px;
            padding: 20px;
        }
        h1 {
            font-family: 'Bebas Neue', cursive;
            font-size: 48px;
            color: #ff6b35;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #cbd5e0;
            font-size: 18px;
            margin-bottom: 40px;
        }
        .button-grid {
            display: grid;
            gap: 20px;
            max-width: 400px;
            margin: 0 auto;
        }
        .btn {
            background: white;
            color: #1a1f2e;
            padding: 20px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 18px;
            transition: all 0.3s ease;
            display: block;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 107, 53, 0.3);
        }
        .btn-primary {
            background: linear-gradient(135deg, #ff6b35 0%, #ffd23f 100%);
            color: white;
        }
        .icon {
            font-size: 30px;
            display: block;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>FRENCH ROOFING LLC</h1>
        <p class="subtitle">Warranty Management Portal</p>
        
        <div class="button-grid">
            <a href="warranty-registration.html" class="btn btn-primary">
                <span class="icon">📋</span>
                Register New Warranty
            </a>
            
            <a href="warranty-tracker.html" class="btn">
                <span class="icon">🔍</span>
                Check Warranty Status
            </a>
        </div>
    </div>
</body>
</html>
