<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Your Roofing Warranty - French Roofing LLC</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&display=swap');
        
        :root {
            --primary-dark: #1a1f2e;
            --primary-orange: #ff6b35;
            --accent-yellow: #ffd23f;
            --steel-gray: #4a5568;
            --light-gray: #f7fafc;
            --success-green: #48bb78;
            --text-primary: #2d3748;
            --shadow-xl: 0 20px 40px rgba(0,0,0,0.15);
            --shadow-glow: 0 0 40px rgba(255, 107, 53, 0.1);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Work Sans', sans-serif;
            background: linear-gradient(135deg, #1a1f2e 0%, #2d3748 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        
        /* Animated background pattern */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                repeating-linear-gradient(45deg, transparent, transparent 35px, rgba(255, 107, 53, 0.03) 35px, rgba(255, 107, 53, 0.03) 70px),
                repeating-linear-gradient(-45deg, transparent, transparent 35px, rgba(255, 210, 63, 0.02) 35px, rgba(255, 210, 63, 0.02) 70px);
            pointer-events: none;
            animation: slidePattern 20s linear infinite;
        }
        
        @keyframes slidePattern {
            0% { transform: translateX(0) translateY(0); }
            100% { transform: translateX(70px) translateY(70px); }
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }
        
        .warranty-card {
            background: white;
            border-radius: 20px;
            box-shadow: var(--shadow-xl);
            overflow: hidden;
            transform: translateY(0);
            transition: transform 0.3s ease;
            position: relative;
        }
        
        .warranty-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, var(--primary-orange) 0%, var(--accent-yellow) 100%);
        }
        
        .card-header {
            background: linear-gradient(135deg, var(--primary-dark) 0%, #2d3748 100%);
            padding: 40px 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .card-header::after {
            content: '🏠';
            position: absolute;
            right: -20px;
            top: -20px;
            font-size: 100px;
            opacity: 0.1;
            transform: rotate(-15deg);
        }
        
        .logo {
            font-family: 'Bebas Neue', cursive;
            font-size: 42px;
            color: var(--primary-orange);
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-transform: uppercase;
            animation: logoGlow 3s ease-in-out infinite;
        }
        
        @keyframes logoGlow {
            0%, 100% { text-shadow: 0 0 20px rgba(255, 107, 53, 0.5); }
            50% { text-shadow: 0 0 30px rgba(255, 107, 53, 0.8), 0 0 40px rgba(255, 210, 63, 0.5); }
        }
        
        .tagline {
            color: #e2e8f0;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 1px;
        }
        
        .form-container {
            padding: 40px 30px;
        }
        
        .form-title {
            font-family: 'Bebas Neue', cursive;
            font-size: 32px;
            color: var(--primary-dark);
            margin-bottom: 10px;
            text-align: center;
            letter-spacing: 1px;
        }
        
        .form-subtitle {
            color: var(--steel-gray);
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 25px;
            position: relative;
        }
        
        .form-label {
            display: block;
            color: var(--text-primary);
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .form-input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            font-family: 'Work Sans', sans-serif;
            transition: all 0.3s ease;
            background: white;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--primary-orange);
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
            transform: translateY(-1px);
        }
        
        .address-group {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 10px;
        }
        
        @media (max-width: 600px) {
            .address-group {
                grid-template-columns: 1fr;
            }
        }
        
        .date-input {
            position: relative;
        }
        
        .date-input::before {
            content: '📅';
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            opacity: 0.5;
        }
        
        .submit-btn {
            width: 100%;
            padding: 18px 32px;
            background: linear-gradient(135deg, var(--primary-orange) 0%, #ff8c5a 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
            margin-top: 20px;
        }
        
        .submit-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        
        .submit-btn:hover::before {
            width: 400px;
            height: 400px;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 107, 53, 0.4);
        }
        
        .submit-btn:active {
            transform: translateY(0);
        }
        
        .warranty-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--accent-yellow);
            color: var(--primary-dark);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
            margin: 20px auto;
            display: flex;
            width: fit-content;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .security-note {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
            padding: 16px;
            background: var(--light-gray);
            border-radius: 10px;
            font-size: 13px;
            color: var(--steel-gray);
        }
        
        .security-note::before {
            content: '🔒';
            font-size: 20px;
        }
        
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(26, 31, 46, 0.9);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        
        .loading-overlay.active {
            display: flex;
        }
        
        .loader {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid var(--primary-orange);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loader"></div>
    </div>
    
    <div class="container">
        <div class="warranty-card">
            <div class="card-header">
                <div class="logo">French Roofing LLC</div>
                <div class="tagline">Protecting Your Investment Since 2019</div>
            </div>
            
            <div class="form-container">
                <h1 class="form-title">Register Your Warranty</h1>
                <p class="form-subtitle">Secure your 5-year protection plan in just 60 seconds</p>
                
                <div class="warranty-badge">
                    ⭐ 5-Year Comprehensive Coverage
                </div>
                
                <form id="warrantyForm" action="#" method="POST">
                    <div class="form-group">
                        <label class="form-label" for="customerName">Customer Name</label>
                        <input 
                            type="text" 
                            id="customerName" 
                            name="customerName" 
                            class="form-input" 
                            placeholder="John Smith"
                            required
                        >
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="streetAddress">Customer Address</label>
                        <input 
                            type="text" 
                            id="streetAddress" 
                            name="streetAddress" 
                            class="form-input" 
                            placeholder="123 Main Street"
                            required
                        >
                    </div>
                    
                    <div class="form-group">
                        <div class="address-group">
                            <input 
                                type="text" 
                                id="city" 
                                name="city" 
                                class="form-input" 
                                placeholder="City"
                                required
                            >
                            <input 
                                type="text" 
                                id="state" 
                                name="state" 
                                class="form-input" 
                                placeholder="State"
                                maxlength="2"
                                required
                            >
                            <input 
                                type="text" 
                                id="zipCode" 
                                name="zipCode" 
                                class="form-input" 
                                placeholder="ZIP"
                                pattern="[0-9]{5}"
                                required
                            >
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="installDate">Date of New Roof Installation</label>
                        <div class="date-input">
                            <input 
                                type="date" 
                                id="installDate" 
                                name="installDate" 
                                class="form-input"
                                required
                            >
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="invoiceNumber">Invoice Number</label>
                        <input 
                            type="text" 
                            id="invoiceNumber" 
                            name="invoiceNumber" 
                            class="form-input" 
                            placeholder="INV-2024-001"
                            required
                        >
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="customerEmail">Email Address</label>
                        <input 
                            type="email" 
                            id="customerEmail" 
                            name="customerEmail" 
                            class="form-input" 
                            placeholder="john@example.com"
                            required
                        >
                    </div>
                    
                    <button type="submit" class="submit-btn">
                        Register My Warranty
                    </button>
                    
                    <div class="security-note">
                        Your information is secure and encrypted. We'll send you a confirmation email once your warranty is registered.
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <script>
        document.getElementById('warrantyForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Show loading overlay
            document.getElementById('loadingOverlay').classList.add('active');
            
            // Gather form data
            const formData = {
                customerName: document.getElementById('customerName').value,
                streetAddress: document.getElementById('streetAddress').value,
                city: document.getElementById('city').value,
                state: document.getElementById('state').value.toUpperCase(),
                zipCode: document.getElementById('zipCode').value,
                installDate: document.getElementById('installDate').value,
                invoiceNumber: document.getElementById('invoiceNumber').value,
                customerEmail: document.getElementById('customerEmail').value,
                registrationDate: new Date().toISOString(),
                warrantyExpiry: new Date(new Date(document.getElementById('installDate').value).setFullYear(new Date(document.getElementById('installDate').value).getFullYear() + 5)).toISOString()
            };
            
            // Log data for debugging (remove in production)
            console.log('Warranty Registration Data:', formData);
            
            // Make.com webhook URL
            const MAKE_WEBHOOK_URL = 'https://hook.us2.make.com/83a5ynsjwhu53yw8kwudhtdktspdqpsk';
            
            // Send to Make.com webhook
            fetch(MAKE_WEBHOOK_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(data => {
                window.location.href = 'registration-success.html';
            })
            .catch(error => {
                console.error('Error:', error);
                alert('There was an error registering your warranty. Please try again.');
                document.getElementById('loadingOverlay').classList.remove('active');
            });
        });
        
        // Auto-format state input to uppercase
        document.getElementById('state').addEventListener('input', function(e) {
            e.target.value = e.target.value.toUpperCase();
        });
        
        // Set max date to today for installation date
        document.getElementById('installDate').max = new Date().toISOString().split('T')[0];
    </script>
</body>
</html>
